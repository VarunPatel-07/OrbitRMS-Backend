[tool.black]
line-length = 120
target-version = ["py310"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true

[tool.ruff]
line-length = 120
select = ["E", "F", "I"]  # errors, formatting, imports
ignore = []
fix = true

[tool.ruff.lint.isort]
known-first-party = ["app"]  # your main project name