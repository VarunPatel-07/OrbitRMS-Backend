version: '3.9'

services:
  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend

  valkey:
    image: valkey/valkey
    container_name: orbit-docker-valkey
    ports:
      - "6380:6379"
    depends_on:
      - mysql
    networks:
      - backend

  python:
    image: python:3.11
    container_name: python-app
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "8001:8000"
    command: >
      sh -c "pip install -r requirements.txt && uvicorn index:app --reload --host 0.0.0.0"
    depends_on:
      - mysql
    networks:
      - backend

volumes:
  mysql_data:


networks:
  backend:
    driver: bridge
